apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: sagefahd/django-app:latest # dockerHubname/image Replace with your image
          ports:
            - containerPort: 8000 
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:Sagefahd@postgres:5432/mydb"
   

